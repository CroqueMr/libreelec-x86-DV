name: Bug report
description: Report a playback, HDMI, hardware, or installation problem.
title: "[Bug] "
body:
  - type: input
    id: build
    attributes:
      label: Build version
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and HDMI chain
      description: Include the exact GPU and your TV or projector, receiver and any adapters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the source format, selected rendering circuit, expected result and what actually happened.
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Debug log short URL
      description: Enable debug logging, reproduce the problem, then upload the latest log from Settings → LibreELEC → System → Submit Log.
