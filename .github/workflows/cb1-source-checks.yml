name: CB1 integration checks
on: [push, pull_request]
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfmt-dev nlohmann-json3-dev squashfs-tools
      - name: Prepare matched test sources
        run: bash .github/scripts/prepare-test-sources.sh
      - name: Test source staging
        run: python3 -m unittest discover -s tests/cb1 -p 'test_*.py'
      - name: Verify bundled engine and model
        run: |
          python3 CB1/tools/verify.py
          python3 scripts/cb1-stage.py --check
      - name: Check whitespace
        run: git diff --check
